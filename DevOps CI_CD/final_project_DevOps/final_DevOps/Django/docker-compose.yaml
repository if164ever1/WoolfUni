services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: local-development-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_ENGINE: postgresql
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: appdb
      DATABASE_USER: dbadmin
      DATABASE_PASSWORD: local-development-password
      APP_MESSAGE: Django is running with Docker Compose.
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

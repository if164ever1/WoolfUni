{{- range .Values.repositories }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: {{ .url | quote }}
  {{- with .username }}
  username: {{ . | quote }}
  {{- end }}
  {{- with .password }}
  password: {{ . | quote }}
  {{- end }}
{{- end }}

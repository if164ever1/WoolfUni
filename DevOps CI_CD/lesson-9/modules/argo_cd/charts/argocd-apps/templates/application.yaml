{{- range .Values.applications }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default "argocd" }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .project | default "default" }}
  source:
    repoURL: {{ .repoURL | quote }}
    targetRevision: {{ .targetRevision | default "main" | quote }}
    path: {{ .path | quote }}
    helm:
      releaseName: {{ .name | quote }}
  destination:
    server: {{ .destinationServer | default "https://kubernetes.default.svc" | quote }}
    namespace: {{ .destinationNamespace | quote }}
  syncPolicy:
    {{- with .automated }}
    automated:
      prune: {{ .prune | default true }}
      selfHeal: {{ .selfHeal | default true }}
      allowEmpty: false
    {{- end }}
    syncOptions:
      {{- range .syncOptions }}
      - {{ . | quote }}
      {{- end }}
---
{{- end }}
